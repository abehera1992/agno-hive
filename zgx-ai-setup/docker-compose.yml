# zgx-ai-setup — the GB10 (ZGX) vLLM serving stack for AGNOHive.
# Captures the ad-hoc `docker run` commands that were previously hand-typed on the box.
#
# Bring up:   HF_TOKEN=<read-token> docker compose -f docker-compose.yml up -d
# The GB10 GPU is shared via CDI (NVIDIA Container Toolkit). HF_TOKEN must be exported
# (a HuggingFace read token) so the images can pull the FP8 weights on first start.
#
# This is the ALL-MoE layout (the production config): one resident 30B coordinator
# serves the whole agno roster + LightRAG; a small embedding server is the only other
# resident vLLM process. The optional dedicated-32B and llama-swap pool (for the
# "diverse roster" variant) are documented in README.md, not started here.

services:
  # Resident coordinator — serves the agno roster + LightRAG via LiteLLM under the
  # stable alias qwen3-coder-30b (kept so litellm-config + agents _VLLM_MODEL_MAP need
  # no change). Backing model is Qwen3-30B-A3B-Instruct-2507 (general-instruct, non-thinking,
  # 3B-active MoE) — swapped in 2026-07-25 to replace Qwen3-Coder-30B; uses the hermes
  # tool-parser (general instruct), not qwen3_coder.
  # --max-model-len: the fixed per-run injection (~56K: hive.md + patterns) plus a real
  # multi-tool engineering task overflows 65536; 131072 was the stable middle ground but a
  # 6-step migration-writing task still overflowed it (2026-07-28). 262144 was tried and
  # OOM'd under load once before (2026-07-26) -- re-testing at 262144 again (2026-07-28) to
  # see if it holds under today's actual usage pattern. Revert to 131072 if it OOMs again.
  vllm-coord:
    image: timothystewart6/vllm-gb10:latest
    container_name: vllm-coord
    restart: unless-stopped
    entrypoint: ["vllm"]
    command: >
      serve Qwen/Qwen3-30B-A3B-Instruct-2507-FP8
      --served-model-name qwen3-coder-30b
      --enable-auto-tool-choice --tool-call-parser hermes
      --gpu-memory-utilization 0.6 --max-model-len 262144
      --host 0.0.0.0 --port 8000
    ports:
      - "8003:8000"
    volumes:
      - /home/abehera1992/.cache/vllm-hf:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HF_TOKEN}
    devices:
      - nvidia.com/gpu=all   # CDI device (mirrors `--device nvidia.com/gpu=all`)

  # Resident embedding server for LightRAG (qwen3-embedding, 1024-dim). Always up.
  vllm-embed:
    image: timothystewart6/vllm-gb10:latest
    container_name: vllm-embed
    restart: unless-stopped
    entrypoint: ["vllm"]
    command: >
      serve Qwen/Qwen3-Embedding-0.6B
      --runner pooling
      --gpu-memory-utilization 0.05 --max-model-len 8192
      --host 0.0.0.0 --port 8000
    ports:
      - "8002:8000"
    volumes:
      - /home/abehera1992/.cache/vllm-hf:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HF_TOKEN}
    devices:
      - nvidia.com/gpu=all

  # LightRAG EXTRACT role — fast 8B model for entity extraction (role_llm_configs, EK-105).
  # LiteLLM alias "llama3.1-8b" routes here (:9100). Only needed for indexing workloads;
  # stop this container when not indexing to free ~13GB of unified memory.
  vllm-extract:
    image: timothystewart6/vllm-gb10:latest
    container_name: vllm-extract
    restart: unless-stopped
    entrypoint: ["vllm"]
    command: >
      serve RedHatAI/Meta-Llama-3.1-8B-Instruct-FP8
      --served-model-name llama3.1-8b
      --gpu-memory-utilization 0.1 --max-model-len 8192
      --host 0.0.0.0 --port 8000
    ports:
      - "9100:8000"
    volumes:
      - /home/abehera1992/.cache/vllm-hf:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HF_TOKEN}
    devices:
      - nvidia.com/gpu=all

  # OpenAI-compatible gateway. agno + LightRAG talk to this (:4000); it routes model
  # names to the vLLM servers, and (AGNOHive 2.3.2) to cloud providers.
  #
  # On the default compose bridge network (NOT host, since 2026-08-08) -- litellm now
  # also holds real cloud provider API keys and makes outbound internet calls, which
  # doesn't need host-level network access and is unnecessary exposure for a service
  # holding credentials. Local vLLM containers (vllm-coord/vllm-embed/vllm-extract) are
  # reachable by service name on this same compose network (see litellm-config.yaml's
  # api_base values); a container NOT defined in this compose file (the :8004/:8005
  # ad-hoc/candidate slots) is reached via `host.docker.internal`, which the
  # `extra_hosts` entry below makes resolvable on native Linux Docker Engine (this is
  # NOT automatic outside Docker Desktop, unlike on Mac/Windows).
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm
    restart: unless-stopped
    ports:
      - "4000:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    # Single source of truth for cloud provider keys (2026-08-09): the repo-root .env
    # (the same one agno-api's config.py reads via load_dotenv()) -- NOT a separate
    # zgx-ai-setup/.env. Two live incidents (ANTHROPIC_API_KEY, then GEMINI_API_KEY)
    # where the key was added to the repo root and litellm never saw it, because
    # Compose's ${VAR} substitution only ever reads a .env next to THIS file by
    # default -- it has no reason to know the repo-root one exists.
    #
    # env_file: (below) injects each KEY=value line from ../.env directly into the
    # container's environment -- this is a DIFFERENT mechanism from ${VAR} substitution
    # in the YAML (which still only sees zgx-ai-setup/.env or the invoking shell, and
    # is resolved before env_file is ever read). Do NOT also list these same keys
    # under `environment:` with ${VAR:-} syntax -- Compose gives an explicit
    # `environment:` entry precedence over `env_file:` for the same name, so an
    # unresolved ${ANTHROPIC_API_KEY:-} (empty, since YAML substitution doesn't see
    # this file either) would silently override the real value env_file just set.
    # litellm-config.yaml's routes reference os.environ/<VAR> by these exact names,
    # so having them land in the container's env via env_file is sufficient on its
    # own -- no environment: block needed for these five keys.
    env_file:
      - ../.env
