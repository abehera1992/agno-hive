name: parallel-review
description: Parallel read-only analysis — Researcher, SecurityReviewer, and PerformanceReviewer run simultaneously. All agents receive the task at once and read independently; coordinator synthesises results.
# coordinator_model / each agent's model: are DB-managed (AGNOHive 2.3.2 addendum,
# 2026-08-08) — see team_role_models. Set model: back here to pin a role and take
# it out of DB control again.
# mode: broadcast (corrected 2026-08-15, was "collaborate") -- "collaborate" is NOT a
# real agno TeamMode (confirmed against the installed agno/team/mode.py: the only
# values are coordinate/route/broadcast/tasks). agno/team/_init.py's mode-resolution
# if/elif chain never matched the unrecognized string, so respond_directly/
# delegate_to_all_members silently stayed at their coordinate-equivalent defaults --
# this team was NEVER actually broadcasting the task to all 3 reviewers simultaneously
# as this file's own description above claims; it ran exactly like plain coordinate
# mode, leaving it up to the coordinator to correctly delegate to all three itself.
# broadcast is the real TeamMode matching "All agents receive the task at once".
mode: broadcast
# Read-only allowlist for the coordinator's direct tool surface (members are scoped separately
# via their own `tools:` lists). Without this, the coordinator receives every tool from every
# connected MCP unfiltered — including write/staging tools (apply_diff, write_file, notion_*,
# confirm_action/reject_action) that this team must never call. Keep this list read-only.
coordinator_tools:
  - list_directory_tree
  - find_files
  - search_files
  - get_file_content
  - list_directory
  - search_knowledge_graph
  - lightrag_query
  - get_context_section
  - load_skill

agents:
  - name: Researcher
    description: Codebase structure and data flow specialist. Maps modules, entry points, and dependencies.
    role: Maps overall structure, entry points, and data flow across the codebase.
    tools:
      - list_directory_tree
      - find_files
      - search_files
      - get_file_content
      - lightrag_query
      - load_skill
    skills:
      - verification-discipline
    instructions:
      - Call list_directory_tree() or find_files('**/*') first to map the full structure before reading any file.
      - Read at least one entry-point file per top-level directory — never describe a module from its name alone.
      - For 'how does X work' questions run search_files(X, '**/*') to find all occurrences, then read the 2-3 most relevant files.
      - Ground every claim in an actual file read from this session — never fabricate paths or function names.
      - Cover every top-level directory in your response; stopping at the first interesting result is a failure.

  - name: SecurityReviewer
    description: Security analysis specialist. Identifies vulnerabilities, auth issues, and secrets exposure.
    role: Reviews auth flows, input validation, secrets handling, and API boundaries for vulnerabilities.
    tools:
      - get_file_content
      - search_files
      - find_files
      - lightrag_query
      - git_diff
      - load_skill
    skills:
      - verification-discipline
    instructions:
      - Focus on OWASP Top 10 — injection, broken auth, sensitive data exposure, security misconfiguration.
      - Search for secrets and credentials with search_files patterns like 'password', 'secret', 'api_key', 'token'.
      - Check auth middleware and permission guards — read the actual implementation, not just the imports.
      - Flag real vulnerabilities only with exact file:line references. Do not report theoretical risks without evidence.
      - If git_diff is available, review changed files specifically before reviewing the broader codebase.

  - name: PerformanceReviewer
    description: Performance analysis specialist. Identifies N+1 queries, missing indexes, and hot-path bottlenecks.
    role: Reviews database queries, loops, caching patterns, and hot paths for performance issues.
    tools:
      - get_file_content
      - search_files
      - find_files
      - lightrag_query
      - load_skill
    skills:
      - verification-discipline
    instructions:
      - Search for database query patterns — look for ORM calls inside loops (N+1), missing .select_related()/.prefetch_related(), unbounded queries.
      - Check for missing pagination on list endpoints.
      - Look for synchronous operations in async contexts and blocking I/O in hot paths.
      - Cite specific file:line for every finding with a concrete explanation of the performance impact.
      - Prioritise findings by impact — a confirmed N+1 on a high-traffic endpoint outweighs a minor inefficiency.
