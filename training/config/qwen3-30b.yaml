# Phase 3 recipe — QLoRA + ORPO on Qwen3-30B-A3B-Instruct-2507 (BF16 base).
#
# Target: Axis C (citation precision). Axis A must not regress.
#
# CORRECTED 2026-07-30 after the widened Phase 2.5 suite. This header used to read
# "Axis C baseline 50%; A and D are already at 100%, there is NO headroom" — all three
# figures came from the thin n=1..3 suite and are wrong at n=14..27. Measured baselines:
#     A tool_call 1.000 (n=16)   B grounding 0.673 (n=27)
#     C citation  0.944 (n=18)   D guard     0.500 (n=14)
# So C had ~6 points of headroom, not 50, and D is the weak axis rather than a saturated
# one. Hyperparameters below are still tuned to move C while disturbing A as little as
# possible; a future run aimed at D needs a different corpus, not a different lr.

# Local BF16 snapshot (downloaded 2026-07-30, 57 GB, 16 shards). A repo id would NOT
# resolve here: snapshot_download used local_dir, so the weights are not in the HF cache.
base_model: /home/abehera1992/models/Qwen3-30B-A3B-Instruct-2507
staging_dir: /home/abehera1992/models

# ── naming standard (2026-07-30) ──────────────────────────────────────────────
# candidate : qwen3-30b-hive-v1   <- the tuned artifact
# baseline  : qwen3-30b-instruct  <- the untuned reference the gate compares against
candidate_name: qwen3-30b-hive-v2
baseline_name: qwen3-30b-instruct

# LoRA adapter lands here. The MERGED BF16 checkpoint is written separately by
# export/merge.py --out; keep the two apart so a failed merge cannot clobber the
# adapter that produced it.
output_dir: checkpoints/qwen3-30b-hive-v2
merged_dir: checkpoints/qwen3-30b-hive-v2-merged-bf16

# ── data ──────────────────────────────────────────────────────────────────────
dataset: training/data/corpus_v2.jsonl
#
# TRAINS ON PREFERENCE PAIRS ONLY (decision 2026-07-30). Expected composition:
#   162  synthetic_citation  (81 with_excerpt + 81 no_excerpt)  <- Axis C, the target
#    31  patterns_md         (WRONG -> CORRECT guard pairs)     <- Axis D regression guard
#     2  failure_log         (captured failures, ids 61/62)
#   ---
#   195  pairs handed to the trainer
#
# The 345 `kind: sft` rows in the same file are IGNORED BY DESIGN, not by oversight:
#   * 287 come from postgres_sessions — UNVERIFIED past hive outputs. 46 of them assert
#     line numbers nobody checked. The source filters catch error envelopes and refusals,
#     but a confidently FABRICATED citation reads exactly like a good answer and passes
#     through. Training on them would teach fluent fabrication while the 162 synthetic
#     pairs teach restraint — a corpus arguing with itself, unverified side winning 287:162.
#   * They are also redundant: ORPO applies an SFT cross-entropy term to the `chosen`
#     response of every pair, so the preference set carries its own regularisation.
#     No separate SFT ballast is needed to protect general ability.
# To reintroduce SFT later, VERIFY it first (check each line claim against the repo and
# drop the ones that fail) rather than trusting the source filter.
#
# ORPO over DPO: folds the SFT term into the preference objective AND needs no separate
# reference model resident — which matters on a shared 121 GB pool. Use "dpo" only if a
# reference model is affordable.
objective: orpo

# ── LoRA ──────────────────────────────────────────────────────────────────────
lora:
  # r=16 is deliberately modest. Citation restraint is a narrow behavioural edit, not
  # new knowledge; higher rank buys capacity we do not need and raises the odds of
  # eroding the guard/tool-call behaviour that is already perfect.
  r: 16
  alpha: 32            # 2x rank — standard, keeps effective LR sane
  dropout: 0.0         # Unsloth's fast path; regularisation comes from few epochs
  bias: none
  # v2 (2026-07-30): widened from attention-only to all 7 linear projections after v1
  # came out completely INERT (reward margins negative, every axis delta 0.000).
  # Listed EXPLICITLY rather than as the string "all-linear": on a 128-expert MoE,
  # "all-linear" can also attach to every expert's projections, which would multiply
  # trainable params and VRAM unpredictably. This list is the intended "all 7".
  # This is the lever most likely to cause catastrophic forgetting on A/D - the gate's
  # no-regression check is what catches it.
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  use_gradient_checkpointing: unsloth

# ── optimisation ──────────────────────────────────────────────────────────────
train:
  max_seq_length: 2048
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8      # effective batch 8
  # v2: 5e-6 -> 2e-5 (4x). At 5e-6 over 24 steps the run was inert; nothing moved.
  learning_rate: 2.0e-5
  lr_scheduler_type: cosine
  warmup_ratio: 0.05
  # v2: 1 -> 4 epochs (24 -> ~96 optimiser steps). 24 steps was too few to move a 30B.
  # Watch for the memorisation risk the v1 comment warned about: the synthetic citation
  # pairs share a template, so over-training can teach the PHRASING of restraint rather
  # than restraint itself. Axis C rising while B/D fall would be that signature.
  num_train_epochs: 4
  max_steps: -1                        # epoch-bounded, not step-bounded
  optim: adamw_8bit
  weight_decay: 0.01
  # v2: 0.1 -> 0.3. Main lever for "prioritise citation restraint".
  beta: 0.3
  bf16: true
  seed: 42
  logging_steps: 5
  save_strategy: epoch

# ── quantisation ──────────────────────────────────────────────────────────────
load_in_4bit: true      # QLoRA. ~17 GB for the 30B MoE; verified path on sm_121.

# ── promotion gate (Phase 3 -> 4) ─────────────────────────────────────────────
# Evaluated on the MERGED BF16 candidate, offline, BEFORE any FP8 requantise.
# A and D are regression guards, not targets: they are already 100%.
gate:
  citation_min: 0.80     # Axis C — the reason this run exists
  grounding_min: 0.85    # Axis B
  tool_call_min: 0.98    # Axis A — must not regress
  # Axis D: NO absolute floor — regression check only. Decided 2026-07-30.
  #
  # History: 0.98 was set when D had n=2 and the untuned model scored 1.000 on both. The
  # Phase 2.5 expansion to n=14 put the real baseline at 0.500, so 0.98 had quietly
  # stopped being a regression guard and become a 48-point target. It was briefly set to
  # 0.65, which was worse reasoning — that number was picked after seeing the candidate
  # score 0.643, i.e. fitted to a result rather than derived from a requirement.
  #
  # The real finding is that D does not belong in this file at all. Inspecting the eval
  # prompts settled it: they never state the rule ("write a FastAPI endpoint that takes a
  # session dependency" — nothing says AsyncSession), so Axis D asks the model to RECALL
  # 19 held-out project conventions. That is knowledge, not behaviour:
  #   * it already lives in patterns/*.md, which hive fetches into context at session
  #     start, where it stays correct the moment a rule is edited;
  #   * baked into weights it needs a retrain per new guard and can silently contradict
  #     the repo;
  #   * and roughly half the held-out guards (e.g. GUARD 28, no cross-schema FK to
  #     tenant) are one-off architectural decisions no amount of training on OTHER guards
  #     can teach — the axis has a hard ceiling under an honest holdout.
  # Axis C is the opposite and stays an absolute floor: "do not assert a line number you
  # cannot see" is a behaviour, it generalises, and v2 took it to 1.000.
  #
  # "baseline" resolves at runtime to `baseline - REGRESSION_TOLERANCE` (see
  # gate.resolve_floor), so it tracks the measured baseline instead of going stale.
  guard_min: baseline    # regression guard only — D is delivered via context, not weights
  # Aspirational, NOT enforced. Recorded so the bar is not silently forgotten: if guard
  # adherence is ever moved back into weights, this is the number to beat.
  guard_target: 0.65
  # Raised 4 -> 12 after the Phase 2.5 expansion (2026-07-30). At n=4 the score
  # granularity is 25 points, so a ">=0.80" floor really meant "100%" and a single case
  # flipping moved the whole gate. The suite now carries >=15 cases per axis
  # (C=16, B=16, D=15, A=16), giving ~6-point resolution. 12 leaves headroom for a few
  # cases to be retired without silently disabling the check.
  min_cases_per_axis: 12
