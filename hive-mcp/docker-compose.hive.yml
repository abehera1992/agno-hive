# hive-mcp — generic host-action MCP server for AGNOHive.
#
# Usage:
#   docker compose -f docker-compose.hive.yml up -d              # start with defaults
#   docker compose -f docker-compose.hive.yml --profile agno up -d  # also start agno-hive instance
#   docker compose -f docker-compose.hive.yml down
#
# Prerequisites:
#   - Docker installed
#   - Tailscale installed (ZGX reaches this machine via Tailscale IP)
#
# Environment variables (set in shell or .env before running):
#   PROJECT_PATH          Path to the primary project (default: current directory)
#   HIVE_MCP_PORT         Host port for primary instance (default: 9003)
#   WRITE_REVIEW          Stage all writes for human review (default: true)
#   WEB_SEARCH_ENABLED    Enable web_search and web_fetch tools (default: false)
#   HIVE_BASH_TOOL_ENABLED  Enable persistent bash sessions + background jobs
#                           (bash_session_start/bash_run/bash_job_status/bash_job_kill,
#                           default: true) -- set false to disable
#
# External integrations (optional — leave unset to disable):
#   NOTION_API_KEY                Notion integration token (notion.so/my-integrations)
#   GOOGLE_SERVICE_ACCOUNT_JSON   Path to Google service account JSON file
#
# Two-project setup (EkamApp + agno-hive):
#   Run with --profile agno to also start hive-mcp-agno on port 9004.
#   Set AGNO_HIVE_PATH to the agno-hive repo path.

services:
  # ── Primary instance — points at your main project ───────────────────────────
  hive-mcp:
    image: ghcr.io/abehera1992/hive-mcp:latest
    container_name: hive-mcp
    restart: unless-stopped
    ports:
      - "${HIVE_MCP_PORT:-9003}:9000"
    volumes:
      - ${PROJECT_PATH:-.}:/project
      - /var/run/docker.sock:/var/run/docker.sock
      - ${USERPROFILE:-.}/.gitconfig:/root/.gitconfig:ro
      - ${USERPROFILE:-.}/.ssh:/root/.ssh:ro
    environment:
      - PROJECT_ROOT=/project
      - MCP_PORT=9000
      - WRITE_REVIEW=${WRITE_REVIEW:-true}
      - WEB_SEARCH_ENABLED=${WEB_SEARCH_ENABLED:-false}
      - NOTION_API_KEY=${NOTION_API_KEY:-}
      - GOOGLE_SERVICE_ACCOUNT_JSON=${GOOGLE_SERVICE_ACCOUNT_JSON:-}
      # Read-only SQL grounding (db_schema/db_query) — set to a read-only role DSN to enable.
      # On Docker Desktop the host DB is reachable at host.docker.internal:<published-port>.
      - HIVE_DB_URL=${HIVE_DB_URL:-}
      - HIVE_BASH_TOOL_ENABLED=${HIVE_BASH_TOOL_ENABLED:-true}

  # ── agno-hive instance — points at the agno-hive repo itself ─────────────────
  # Start with: docker compose -f docker-compose.hive.yml --profile agno up -d
  # Connects on port 9004. Set in hive terminal: Use-AgnoHive
  hive-mcp-agno:
    image: ghcr.io/abehera1992/hive-mcp:latest
    container_name: hive-mcp-agno
    restart: unless-stopped
    profiles: ["agno"]
    ports:
      - "9004:9000"
    volumes:
      - ${AGNO_HIVE_PATH:-../agno-hive}:/project
      - /var/run/docker.sock:/var/run/docker.sock
      - ${USERPROFILE:-.}/.gitconfig:/root/.gitconfig:ro
      - ${USERPROFILE:-.}/.ssh:/root/.ssh:ro
    environment:
      - PROJECT_ROOT=/project
      - MCP_PORT=9000
      - WRITE_REVIEW=${WRITE_REVIEW:-true}
      - WEB_SEARCH_ENABLED=${WEB_SEARCH_ENABLED:-false}
