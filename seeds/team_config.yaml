# First-run seed for team_role_tools / team_role_skills -- NOT live config.
#
# Read ONCE, only when team_role_tools is completely empty (swarm/team_config.py's
# load_cache() -> _seed_defaults()). Editing this file does NOT change a deployment
# that has already been seeded: use the admin API instead, which is the only thing
# that alters a running system's grants.
#
#     GET/POST/DELETE /admin/team-config/tools
#     POST            /admin/team-config/reload
#
# It lives here, outside swarm/, precisely so it cannot be mistaken for the runtime
# source. It is still REQUIRED: teams/*.yaml had their tools:/skills: fields removed
# on 2026-08-18 when the DB became the runtime source, so this snapshot of that
# former YAML content is the only thing a fresh clone can seed from. Delete it and a
# fresh deployment seeds nothing -- which does not mean "no tools", it means every
# role falls through to unrestricted and sees the FULL tool surface, apply_diff and
# run_command included (api/server.py _load_team()'s `is None` fallback).
#
# tool_registry/skill_registry are also bootstrapped from the union of the names
# below. That is an honest starting point (every name here was in real use at
# migration time), not a substitute for refresh_registry()'s live-MCP enumeration,
# which is the real source of truth once a swarm run has supplied one.

