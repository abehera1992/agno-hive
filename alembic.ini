; Alembic config for agnohive's OWN app-storage database (chat_sessions/
; session_messages/failure_log/task_outcome_queue plus the durable execution/
; evidence backbone -- swarm/db.py's `metadata`).
;
; sqlalchemy.url is deliberately left blank here -- alembic/env.py sets it
; programmatically from swarm.db.resolve_database_url() on every invocation,
; so this file never needs editing per-deployment and never hard-codes a DSN
; (matching swarm/db.py's own DATABASE_URL/POSTGRES_URI/SQLite-fallback
; resolution instead of inventing a second connection mechanism).
;
; Does NOT manage the routing database (model_catalog/team_role_models) or any
; connected project's own database -- see swarm/migrations.py's module
; docstring.

[alembic]
script_location = alembic

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
